<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pagina niet gevonden — De Haas Styling</title>
<meta name="robots" content="noindex">
<base href="/">
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/fonts.css">
<style>
:root{--cream:#F5F1EB;--taupe:#685B4D;--espresso:#2B221D;--muted:#6F6458}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:grid;place-items:center;background:var(--cream);color:var(--espresso);font-family:"Jost",system-ui,sans-serif;font-weight:300;text-align:center;padding:24px}
p.eb{font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:var(--taupe)}
h1{font-family:"Cormorant Garamond",serif;font-weight:300;font-size:clamp(40px,7vw,72px);line-height:1.05;margin:16px 0}
h1 em{color:var(--taupe)}
p{color:var(--muted);max-width:30em;margin:0 auto}
a.btn{display:inline-block;margin-top:32px;padding:16px 30px;border-radius:999px;background:var(--taupe);color:var(--cream);text-decoration:none;font-size:13px;letter-spacing:.2em;text-transform:uppercase}
</style>
</head>
<body>
<main>
  <p class="eb">404 · De Haas Styling</p>
  <h1>Deze pagina is <em>even</em> weg.</h1>
  <p>Geen zorgen: alles over de behandelingen, de salon en de online agenda staat op de homepage.</p>
  <a class="btn" href="./">Naar de homepage</a>
</main>
</body>
</html>
